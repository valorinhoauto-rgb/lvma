<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="logoRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="logoCenter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#logoBg)" stroke="#1e293b" stroke-width="2.5" />
  
  <!-- Subtle Glowing Inner Accent -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="url(#logoLeft)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Four Game Corner Dots for M - A - L - M -->
  <circle cx="26" cy="26" r="3.5" fill="#10b981" opacity="0.8" />
  <circle cx="102" cy="26" r="3.5" fill="#ec4899" opacity="0.8" />
  <circle cx="26" cy="102" r="3.5" fill="#06b6d4" opacity="0.8" />
  <circle cx="102" cy="102" r="3.5" fill="#8b5cf6" opacity="0.8" />

  <!-- Left Ribbon Pillar -->
  <path d="M 28 88 L 28 44 C 28 40 32 37 36 39 L 52 50 C 55 52 57 56 57 60 L 57 88 C 57 91 53 93 50 91 L 35 81 C 31 79 28 82 28 88 Z" fill="url(#logoLeft)" filter="url(#logoGlow)" />

  <!-- Right Ribbon Pillar -->
  <path d="M 100 88 L 100 44 C 100 40 96 37 92 39 L 76 50 C 73 52 71 56 71 60 L 71 88 C 71 91 75 93 78 91 L 93 81 C 97 79 100 82 100 88 Z" fill="url(#logoRight)" />

  <!-- Central Dynamic Peak -->
  <path d="M 64 33 L 80 57 C 82 60 80 64 76 64 L 52 64 C 48 64 46 60 48 57 Z" fill="url(#logoCenter)" opacity="0.95" />

  <!-- Center Diamond Sparkle -->
  <polygon points="64,44 66.5,50.5 73,53 66.5,55.5 64,62 61.5,55.5 55,53 61.5,50.5" fill="#ffffff" />
</svg>
